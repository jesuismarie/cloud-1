services:

  nginx:
    container_name: nginx
    image: my-nginx
    build: ./requirements/nginx/
    env_file: .env
    restart: unless-stopped
    ports:
      - "443:443"
    networks:
      - cloud-1
    volumes:
      - wordpress-volume:/var/www/html/
    depends_on:
      wordpress:
        condition: service_healthy
      phpmyadmin:
        condition: service_started

  mysql:
    container_name: mysql
    image: mysql:8.4
    env_file: .env
    restart: unless-stopped
    environment:
      - MYSQL_PASSWORD_FILE=/run/secrets/db_pass
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_pass
    networks:
      - cloud-1
    volumes:
      - mysql-volume:/var/lib/mysql
    secrets:
      - db_pass
      - db_root_pass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --user=root --password=$$(cat /run/secrets/db_root_pass) --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  wordpress:
    container_name: wordpress
    image: my-wordpress:php-fpm
    build: ./requirements/wordpress/
    env_file: .env
    restart: unless-stopped
    networks:
      - cloud-1
    volumes:
      - wordpress-volume:/var/www/html/
    secrets:
      - wp_root_pass
      - wp_user_pass
      - db_pass
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: phpmyadmin
    env_file: .env
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - cloud-1
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  wordpress-volume:
    driver: local
    driver_opts:
      device: /home/${USER}/data/wordpress
      o: bind
      type: none
  mysql-volume:
    driver: local
    driver_opts:
      device: /home/${USER}/data/mysql
      o: bind
      type: none

networks:
  cloud-1:
    driver: bridge

secrets:
  wp_root_pass:
    file: ./secrets/wp_root_pass.txt
  wp_user_pass:
    file: ./secrets/wp_user_pass.txt
  db_pass:
    file: ./secrets/db_pass.txt
  db_root_pass:
    file: ./secrets/db_root_pass.txt