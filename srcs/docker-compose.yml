services:

  nginx:
    container_name: nginx
    image: my-nginx
    build: ./requirements/nginx/
    env_file: .env
    restart: unless-stopped
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress-volume:/var/www/html/

volumes:
  wordpress-volume:
    driver: local
    driver_opts:
      device: /home/${USER}/data/wordpress
      o: bind
      type: none

networks:
  inception:
    driver: bridge
