- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default deny policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default allow policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow required ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
